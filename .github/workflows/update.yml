name: Update site & Telegram

on:
  schedule:
    - cron: '0 */3 * * *'   # ανανέωση site κάθε 3 ώρες
    - cron: '0 7 * * *'     # 09:00 Ελλάδας (χειμώνας): αποτελέσματα χθες
    - cron: '30 8 * * *'    # 10:30 Ελλάδας (χειμώνας): tips ημέρας
  workflow_dispatch:
    inputs:
      telegram:
        description: 'Telegram: none / tips / next / results'
        default: 'none'

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
  TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
  TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
  TELEGRAM_URL: ${{ vars.TELEGRAM_URL }}
  SITE_URL: ${{ vars.SITE_URL }}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Telegram — αποτελέσματα
        if: github.event.schedule == '0 7 * * *' || inputs.telegram == 'results'
        run: php telegram.php results

      - name: Build site
        run: php build.php

      - name: Social images (story + post PNG)
        continue-on-error: true
        run: |
          for f in story:1920 post:1350; do
            n=${f%%:*}; h=${f##*:}
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=8000 \
              --window-size=1080,$h --screenshot=dist/share/$n.png "file://$PWD/dist/share/$n.html"
          done
          rm -f dist/share/story.html dist/share/post.html
          ls -la dist/share

      - name: Telegram — tips
        if: github.event.schedule == '30 8 * * *' || inputs.telegram == 'tips'
        run: php telegram.php tips

      - name: Telegram — επόμενη αγωνιστική
        if: inputs.telegram == 'next'
        run: php telegram.php next

      - name: Save history (Telegram + track record)
        run: |
          git config user.name "over15-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/posted data/tracked.json 2>/dev/null || git add data/posted
          git diff --cached --quiet || (git commit -m "history update" && git pull --rebase -q && git push)

      - name: Publish to branch "site" (Cloudflare Pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: site
          publish_dir: ./dist
          force_orphan: true
          commit_message: "site update"
